[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness 桌面端：Tauri 2 壳，自动拉起/复用 dsh web，托盘常驻"
edition = "2021"

[lib]
# `_lib` 后缀使 lib 名与 bin 名不冲突（Windows 上 cargo#8519）
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "net", "io-util", "rt-multi-thread"] }
