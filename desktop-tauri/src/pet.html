<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      body {
        cursor: grab;
        touch-action: none;       /* 防止触屏手势导致 pointer 事件异常 */
      }
      body:active { cursor: grabbing; }
      /* 填满窗口，精灵图锚定底部居中（地球不被裁） */
      #pet {
        position: absolute;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-repeat: no-repeat;
        background-position: center bottom;
      }
      /* 气泡通知：悬浮在桌宠角色上方（窗口底部），无阴影防透明蒙版 */
      #pet-bubble {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 6px;  /* 窗口底部，角色上方 */
        min-width: 100px;
        max-width: 256px;
        background: #1c1c24;
        color: #eee;
        border: 1px solid #3a3a44;
        border-radius: 6px;
        padding: 8px 12px;
        font: 12px/1.5 system-ui, sans-serif;
        cursor: pointer;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      #pet-bubble strong { font-size: 12px; color: #ffd75e; font-weight: 600; }
      #pet-bubble span {
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="pet"></div>
    <script src="./pet.js"></script>
  </body>
</html>
