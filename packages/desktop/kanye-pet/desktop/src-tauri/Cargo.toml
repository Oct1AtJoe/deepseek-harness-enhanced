[package]
name = "kanye-pet-desktop"
version = "0.1.0"
description = "kanye-pet 桌面伴侣（Tauri 渲染壳）：透明置顶窗 + Node 引擎子进程"
edition = "2021"

[lib]
name = "kanye_pet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
